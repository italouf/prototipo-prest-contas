databases:
  - name: quiin-db
    plan: free
    databaseName: quiin
    user: quiin

services:
  - type: web
    name: quiin-mockup
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: quiin-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: 2
