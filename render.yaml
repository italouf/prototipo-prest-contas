services:
  - type: web
    name: quiin-mockup
    runtime: python
    plan: free
    healthCheckPath: /health/
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        sync: false
      - key: WEB_CONCURRENCY
        value: 2
