<form method="get" action="{{ dashboard_url }}" class="overview-filters" hx-get="{{ dashboard_url }}" hx-target="#painel-pilar" hx-select="#painel-pilar" hx-swap="outerHTML" hx-push-url="true" hx-indicator="#progresso">
  <input type="hidden" name="base" value="{{ base_param }}"><input type="hidden" name="ano" value="{{ ano_param }}">
  <div class="overview-field overview-cycle-field"><label for="overview-start">Mês/ano inicial</label><div class="overview-month-input"><input type="month" id="overview-start" name="mes_inicial" value="{{ mes_inicial|default:'2024-01' }}" onchange="this.form.requestSubmit()" aria-label="Mês/ano inicial"><span>{{ periodo_analise.inicio|date:'m/Y' }}</span></div></div>
  <div class="overview-field overview-cycle-field"><label for="overview-end">Mês/ano final</label><div class="overview-month-input"><input type="month" id="overview-end" name="mes_final" value="{{ mes_final|default:'2027-06' }}" onchange="this.form.requestSubmit()" aria-label="Mês/ano final"><span>{{ periodo_analise.fim|date:'m/Y' }}</span></div></div>
  {% if acompanhamentos %}<div class="overview-field overview-followup-field"><label for="acompanhamento-select">Acompanhamento</label><select id="acompanhamento-select" name="acompanhamento" onchange="this.form.requestSubmit()">{% for a in acompanhamentos %}<option value="{{ a.pk }}" {% if a.pk == acompanhamento.pk %}selected{% endif %}>{{ a.centro.nome }} · {{ a.periodo_referencia }}</option>{% endfor %}</select></div>{% endif %}
  <div class="overview-field overview-base-field"><span>Base de análise</span><div class="overview-base-toggle" role="group" aria-label="Base de análise" data-testid="base-toggle">
    <a href="{{ dashboard_url }}?{{ filtros_dashboard }}&base=fin" hx-get="{{ dashboard_url }}?{{ filtros_dashboard }}&base=fin" hx-target="#painel-pilar" hx-select="#painel-pilar" hx-swap="outerHTML" hx-push-url="true" {% if base_param == 'fin' %}aria-current="true"{% endif %}>Financeiro</a>
    <a href="{{ dashboard_url }}?{{ filtros_dashboard }}&base=fis" hx-get="{{ dashboard_url }}?{{ filtros_dashboard }}&base=fis" hx-target="#painel-pilar" hx-select="#painel-pilar" hx-swap="outerHTML" hx-push-url="true" {% if base_param == 'fis' %}aria-current="true"{% endif %}>Físico</a>
  </div></div><noscript><button type="submit">Aplicar filtros</button></noscript>
</form>
