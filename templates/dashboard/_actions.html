<details class="overview-more-actions" onkeydown="if(event.key === 'Escape') { this.open = false; this.querySelector('summary').focus(); }">
  <summary class="overview-icon-button" aria-label="Mais ações" title="Mais ações">+</summary>
  <div>
    {% if pode_importar_financeiro %}<a href="{% url 'accountability:importar' %}">Importar dados</a>{% endif %}
    {% if pode_editar_painel or pode_editar_pilar %}<button type="button" data-testid="btn-editar-dados" data-editor-toggle onclick="this.closest('details').open = false; quiinAlternarEditor()"><span data-editor-rotulo>Editar dados</span></button>{% endif %}
    <a href="{% url 'planning:csv' %}?{{ filtros_dashboard }}&amp;base={{ base_param }}">Baixar dados (CSV)</a>
    <button type="button" onclick="this.closest('details').open = false; window.print()">Imprimir</button>
    <button type="button" data-testid="dark-toggle" onclick="this.closest('details').open = false; document.documentElement.classList.toggle('dark'); localStorage.setItem('quiin-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light')">Alternar tema</button>
  </div>
</details>
