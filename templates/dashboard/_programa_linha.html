{% load core_extras %}
<tr {% if linha.total %}class="overview-total-row"{% endif %}><th scope="row">{{ linha.rotulo }}{% if linha.detalhe %}<small>{{ linha.detalhe }}</small>{% endif %}</th><td><c-dashboard.overview-progress :linha="linha" preciso="true" /></td><td>{{ linha.recurso|milhoes_ptbr }}</td><td class="overview-executed">{{ linha.realizado|milhoes_ptbr }}</td><td>{{ linha.projetado|milhoes_ptbr }}</td><td>{{ linha.combinado|milhoes_ptbr }}</td><td>{{ linha.diferenca|milhoes_ptbr }}</td><td><c-dashboard.overview-badge faixa="{{ linha.faixa }}" /></td></tr>
