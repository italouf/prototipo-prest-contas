<div class="overview-header-row">
  <button type="button" data-testid="sidebar-toggle" aria-label="Abrir menu" class="overview-icon-button overview-mobile-menu" @click="aberto = true"><c-ui.icon name="menu" size="16" /></button>
  <div id="dashboard-controls" data-testid="dashboard-controls" data-filtros-fixos>
    <div class="overview-controls-row">
      {% if pilar_overview %}{% include 'dashboard/_controles_pilar_overview.html' %}{% else %}{% include 'dashboard/_controles.html' %}{% endif %}
      <div class="overview-dashboard-actions" role="toolbar" aria-label="Ações do painel">
        <a href="{% if pilar_overview %}{{ dashboard_url }}{% else %}{% url 'core:dashboard' %}{% endif %}?base={{ base_param }}{% if acompanhamento %}&amp;acompanhamento={{ acompanhamento.pk }}{% endif %}" class="overview-action-button overview-clear-filters" data-testid="remover-filtros">Remover filtros</a>
        {% include 'dashboard/_actions.html' %}
      </div>
    </div>
  </div>
  <div class="overview-header-utilities">
    {% include 'components/layout/partner_logos.html' %}
    <div class="overview-header-actions" aria-label="Usuário">
      <span class="overview-user-name">{{ user.nome_topbar }}</span>
      <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit" class="overview-action-button overview-logout" title="Sair"><c-ui.icon name="log-out" size="14" />Sair</button></form>
    </div>
  </div>
</div>
