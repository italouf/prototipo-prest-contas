<div class="overview-header-row">
  <button type="button" data-testid="sidebar-toggle" aria-label="Abrir menu" class="overview-icon-button overview-mobile-menu" @click="aberto = true"><c-ui.icon name="menu" size="16" /></button>
  <div id="dashboard-controls" data-testid="dashboard-controls" data-filtros-fixos>{% include 'dashboard/_controles.html' %}</div>
  <div class="overview-header-actions" role="toolbar" aria-label="Ações do painel">
    <a href="{% url 'core:busca' %}" class="overview-icon-button" aria-label="Busca global" title="Buscar"><c-ui.icon name="search" size="14" /></a>
    <a href="{% url 'planning:csv' %}?{{ filtros_dashboard }}&base={{ base_param }}" class="overview-icon-button" aria-label="Baixar dados (CSV)" title="Baixar dados (CSV)"><c-ui.icon name="download" size="14" /></a>
    <details class="overview-more-actions"><summary class="overview-icon-button" aria-label="Mais ações do painel" title="Mais ações">···</summary><div>
      {% if pode_editar_painel %}<button type="button" data-testid="btn-editar-dados" data-editor-toggle onclick="quiinAlternarEditor(); this.closest('details').open = false">Editar dados</button>{% endif %}
      <button type="button" onclick="window.print()">Imprimir</button>
      <a href="{% url 'core:dashboard' %}">Restaurar padrão</a>
      <button type="button" data-testid="dark-toggle" aria-label="Alternar tema" onclick="document.documentElement.classList.toggle('dark'); localStorage.setItem('quiin-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light')">Alternar tema</button>
    </div></details>
    <c-ui.badge papel="{{ papel }}" data-testid="papel-badge">{{ papel }}</c-ui.badge>
    <span class="overview-user-avatar" aria-hidden="true">{{ user.nome_exibicao|first|upper }}</span>
    <span class="overview-user-name">{{ user.nome_exibicao }}</span>
    <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit" class="overview-icon-button" aria-label="Sair" title="Sair"><c-ui.icon name="log-out" size="14" /></button></form>
  </div>
</div>
