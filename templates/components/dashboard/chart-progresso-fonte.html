{% load core_extras l10n %}
<c-vars chave="" titulo="" hint="" bloco="" />
<section aria-label="{{ titulo }}" class="min-w-0">
  <h3 class="font-display text-base font-semibold">{{ titulo }}</h3>
  <p class="text-xs text-text-muted">{{ hint }}</p>
  <div class="mt-1 flex flex-wrap gap-4 text-xs text-text-muted" aria-hidden="true">
    <span class="inline-flex items-center gap-1.5"><i class="inline-block h-2.5 w-2.5 rounded-sm bg-quiin-royal"></i>Projetado ou captado</span>
    <span class="inline-flex items-center gap-1.5"><i class="inline-block h-2.5 w-2.5 rounded-sm bg-quiin-sky"></i>Executado</span>
  </div>
  <div data-testid="chart-fonte-{{ chave }}" class="flex justify-center py-3">
    {% localize off %}
    <svg viewBox="0 0 220 220" class="h-56 w-56 max-w-full" role="img"
         aria-label="{{ titulo }}: {% if bloco.pct_meta_inteiro is not None %}{{ bloco.pct_meta_inteiro }}% da meta{% else %}captação indisponível{% endif %}; {% if bloco.pct_exec_inteiro is not None %}{{ bloco.pct_exec_inteiro }}% executado{% else %}execução indisponível{% endif %}">
      <circle cx="110" cy="110" r="88" fill="none" stroke="var(--color-border)" stroke-width="13" />
      <circle cx="110" cy="110" r="88" fill="none" stroke="var(--color-quiin-royal)" stroke-width="13"
              pathLength="100" stroke-dasharray="{{ bloco.anel_meta }} 100" transform="rotate(-90 110 110)" />
      <circle cx="110" cy="110" r="67" fill="none" stroke="var(--color-border)" stroke-width="13" />
      <circle cx="110" cy="110" r="67" fill="none" stroke="var(--color-quiin-sky)" stroke-width="13"
              pathLength="100" stroke-dasharray="{{ bloco.anel_exec }} 100" transform="rotate(-90 110 110)" />
      <text x="110" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="var(--color-text)">{% if bloco.pct_meta_inteiro is not None %}{{ bloco.pct_meta_inteiro }}% da Meta{% else %}— da Meta{% endif %}</text>
      <text x="110" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="var(--color-text-muted)">{% if bloco.pct_exec_inteiro is not None %}{{ bloco.pct_exec_inteiro }}% Executado{% else %}— Executado{% endif %}</text>
    </svg>
    {% endlocalize %}
  </div>
  <p data-testid="chart-rodape-{{ chave }}" class="mt-1 text-sm text-text-muted">Execução no período selecionado:
    <c-dashboard.farol-badge faixa="{% if bloco.pct_exec is not None %}critica{% else %}neutra{% endif %}" rotulo="{% if bloco.pct_exec_inteiro is not None %}{{ bloco.pct_exec_inteiro }}%{% else %}—{% endif %}" />
  </p>
</section>
