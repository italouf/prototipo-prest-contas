<c-vars counts="" anos="" />
{% if counts %}<span class="overview-status-counts">{% if counts.ok %}<c-dashboard.overview-badge faixa="ok" rotulo="{{ counts.ok }} {% if anos %}anos atingidos{% elif counts.ok == 1 %}atingida{% else %}atingidas{% endif %}" />{% endif %}{% if counts.parcial %}<c-dashboard.overview-badge faixa="parcial" rotulo="{{ counts.parcial }} {% if counts.parcial == 1 %}parcial{% else %}parciais{% endif %}" />{% endif %}{% if counts.critica %}<c-dashboard.overview-badge faixa="critica" rotulo="{{ counts.critica }} {% if counts.critica == 1 %}crítica{% else %}críticas{% endif %}" />{% endif %}{% if counts.neutra %}<c-dashboard.overview-badge faixa="neutra" rotulo="{{ counts.neutra }} sem lançamento" />{% endif %}</span>{% else %}<c-dashboard.overview-badge faixa="neutra" rotulo="Sem lançamentos" />{% endif %}
