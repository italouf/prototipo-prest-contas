{% load core_extras l10n %}
<c-vars linha="" preciso="" />
<div class="overview-progress" data-status="{{ linha.faixa }}">
  <div class="overview-progress-track" role="img" aria-label="{% if linha.pct is not None %}{{ linha.pct|numero_curto }}% executado{% else %}Sem lançamento{% endif %}">
    <span style="width: {{ linha.barra|unlocalize }}%" {% if linha.pct > 100 %}class="overview-progress-exceeded"{% endif %}></span>
  </div>
  <strong>{% if linha.pct is not None %}{% if preciso %}{{ linha.pct|numero_curto }}{% else %}{{ linha.pct }}{% endif %}%{% else %}—{% endif %}</strong>
</div>
