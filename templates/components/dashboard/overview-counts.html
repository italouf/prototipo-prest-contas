<c-vars counts="" />
{% if counts %}<span class="overview-status-counts"><c-dashboard.overview-badge faixa="ok" rotulo="{{ counts.ok }} {% if counts.ok == 1 %}atingida{% else %}atingidas{% endif %}" /><c-dashboard.overview-badge faixa="parcial" rotulo="{{ counts.parcial }} {% if counts.parcial == 1 %}parcial{% else %}parciais{% endif %}" /><c-dashboard.overview-badge faixa="critica" rotulo="{{ counts.critica }} {% if counts.critica == 1 %}crítica{% else %}críticas{% endif %}" />{% if counts.neutra %}<c-dashboard.overview-badge faixa="neutra" rotulo="{{ counts.neutra }} sem lançamento" />{% endif %}</span>{% else %}<c-dashboard.overview-badge faixa="neutra" rotulo="Sem lançamentos" />{% endif %}
